# Copy to ~/.orch/config.yaml. Restart the daemon (`orch daemon stop`) after editing.
defaultAgent: claude
agents:
  claude:
    command: claude
    args: ["-p", "--", "{prompt}"]      # "--" keeps a prompt starting with "-" from being read as a flag
    summaryArgs: ["-c", "-p", "--", "{prompt}"]
    defaultCooldownSec: 3600
  codex:
    command: codex
    args: ["exec", "--", "{prompt}"]
    summaryArgs: ["exec", "resume", "--last", "--", "{prompt}"]
    defaultCooldownSec: 3600
rules:
  - match: "refactor|architecture|migrate|redesign"
    agent: claude
  - match: "typo|rename|quick|small fix|one-liner"
    agent: codex
    # model: gpt-6-luna   # uncomment to use a cheaper model for small tasks (check /model in codex)
    # effort: low
